 {icon:"⚠️",grad:"g6",fr:"7 erreurs à éviter avec un e-mail temporaire",en:"7 mistakes to avoid with a temporary e-mail",ar:"7 أخطاء خاصك تتجنبها",ex:{fr:"Les usages qui transforment un outil pratique en problème.",en:"The uses that turn a handy tool into a problem.",ar:"الاستعمالات اللي كتحول أداة مفيدة لمشكل."}}

let lang='fr';
let session=null;
const $=id=>document.getElementById(id);
const t=k=>I18N[lang][k]||k;
function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2400); }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(session)); }
function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ return null; } }
async function gmCall(params){ const r=await fetch(GM+'?'+new URLSearchParams(params).toString()); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
function decodeEnt(s){ if(!s) return ''; const ta=document.createElement('textarea'); ta.innerHTML=s; return ta.value; }

async function createSession(nameWanted){
  let d=await gmCall({f:'get_email_address', lang: lang==='ar'?'en':lang});
  let sid=d.sid_token, address=d.email_addr;
  if(nameWanted){
    d=await gmCall({f:'set_email_user', email_user:nameWanted, lang:'en', site:'guerrillamail.com', sid_token:sid});
    if(d.email_addr) address=d.email_addr;
    sid=d.sid_token||sid;
  }
  return {address, password:'', token:sid, accountId:''};
}
function showAddr(){ $('mail').value=session.address; $('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=160x160&data='+encodeURIComponent('mailto:'+session.address); }

function renderPop(){
  const ul=$('popList'); ul.innerHTML='';
  POP.forEach(a=>{
    const li=document.createElement('li');
    const th=document.createElement('div'); th.className='thumb '+a.grad; th.textContent=a.icon;
    const wrap=document.createElement('div');
    const link=document.createElement('a'); link.href='tempbleu-blog.html'; link.textContent=a[lang];
    const p=document.createElement('p'); p.textContent=a.ex[lang];
    wrap.append(link,p); li.append(th,wrap);
    li.onclick=()=>location.href='tempbleu-blog.html';
    ul.appendChild(li);
  });
}
function applyLang(){
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent=t(el.dataset.i); });
  document.documentElement.lang=lang;
  document.documentElement.dir=(lang==='ar')?'rtl':'ltr';
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  renderPop();
}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; applyLang(); });

async function copyAddr(){
  if(!session) return;
  try{ await navigator.clipboard.writeText(session.address); }catch(e){ $('mail').select(); document.execCommand('copy'); }
  toast(t('copied'));
}
$('btnCopy').onclick=copyAddr;
$('btnCopy2').onclick=copyAddr;
$('btnQR').onclick=()=>{ const p=$('qrPop'); p.style.display=p.style.display==='block'?'none':'block'; };
$('btnRefresh').onclick=async()=>{
  if(!session) return;
  try{ const d=await gmCall({f:'check_email', seq:0, sid_token:session.token}); if(d.sid_token){ session.token=d.sid_token; save(); } toast(t('refreshed')+(d.count||0)+' '+t('msgs')); }
  catch(e){ toast(t('err')); }
};
$('btnDelete').onclick=async()=>{
  if(!session || !confirm(t('confirmDel'))) return;
  try{ await gmCall({f:'forget_me', email_addr:session.address, sid_token:session.token}); }catch(e){}
  localStorage.removeItem(LS_KEY);
  session=await createSession(); save(); showAddr(); toast('🗑️');
};
$('changeForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const name=$('newName').value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
  if(name.length<3){ toast(t('tooShort')); return; }
  toast(t('creating'));
  try{
    session=await createSession(name); save(); showAddr();
    const ok=$('okBox'); ok.style.display='block'; ok.textContent=t('saved')+session.address;
  }catch(err){ toast(t('err')); }
});

applyLang();
session=load();
if(session && session.address){ showAddr(); }
else { createSession().then(s=>{ session=s; save(); showAddr(); }).catch(()=>toast(t('err'))); }

</script>
<script>
document.getElementById('bannerX').onclick=()=>{ document.getElementById('topBanner').style.display='none'; };
const ck=document.getElementById('cookieBar');
if(!localStorage.getItem('tempbleu_cookies')) ck.classList.add('show');
document.getElementById('cookieOk').onclick=()=>{ localStorage.setItem('tempbleu_cookies','1'); ck.classList.remove('show'); };
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.08});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
